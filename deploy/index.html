<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="importmap">

    </script>
    <script type="module">
        import '@material/web/all.js';
        import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <script src="scripts/index.js" defer></script>
    <title>Url Shortener Demo</title>
</head>
<body>
    <div class="container">
        <h1 class="md-typescale-display-medium main-heading">
            <svg xmlns="http://www.w3.org/2000/svg" width="55" height="55" fill="currentColor" class="bi bi-link-45deg" viewBox="0 0 16 16">

            Shortener

            </svg>
        </h1>
        <div class="form-container">
            <form id="submit-form">
                <div class="form-group mb-3">
                    <div class="input-group url-div">
                        <p class="error-message"></p>
                        <input type="text" class="form-control" id="input-email" placeholder="Paste url here.." aria-describedby="basic-addon1">
                        <input class="form-control submit-btn" type="submit" value="Shorten">
                    </div>
                </div>
            </form>
        </div>
        <!-- Input to copy the shortened URL -->
        <br />
        <div class="container-result">
            <div class="input-group result-div">
                <input type="text" id="input-result" class="form-control" placeholder="Copy url here.." readonly>
                <span class="input-group-btn">
                    <button class="copy-btn btn btn-default" type="button" onclick="copyToClipboard()">Copy</button>
                </span>
            </div>
        </div>
    </div>
</body>
</html>
